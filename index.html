<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIValen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --bg3: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --text-muted: #666;
      --accent: #ffffff;
      --radius: 10px;
      --font: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-w: 260px;
      --t: 0.2s ease;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      flex-shrink: 0;
      transition: transform var(--t);
      z-index: 100;
      position: relative;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 2px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-empty {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      padding: 20px 0;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all var(--t);
      -webkit-user-select: none;
      user-select: none;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--bg3);
      border-color: var(--border);
      color: var(--text);
    }

    .sidebar-footer {
      padding: 12px;
      border-top: 2px solid var(--border);
    }

    /* buttons */
    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--t);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      flex-shrink: 0;
    }

    .btn-icon:hover { border-color: var(--accent); background: var(--bg3); }
    .btn-icon:active { transform: scale(0.95); }

    .btn-setting {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all var(--t);
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .btn-setting:hover { border-color: var(--accent); color: var(--text); background: var(--bg3); }

    /* overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
      backdrop-filter: blur(2px);
    }

    .overlay.show { display: block; }

    /* main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      min-width: 0;
    }

    /* topbar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
    }

    .topbar-title {
      font-weight: 700;
      font-size: 1rem;
      flex: 1;
    }

    .model-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 4px 10px;
      border: 2px solid var(--border);
      border-radius: 99px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 40px 20px;
    }

    .welcome h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .welcome p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* messages */
    .messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-user { align-items: flex-end; }
    .msg-ai { align-items: flex-start; }

    .msg-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      font-size: 0.92rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .msg-user .msg-bubble {
      background: #1e1e1e;
      border-color: #333;
      border-bottom-right-radius: 4px;
    }

    .msg-ai .msg-bubble {
      background: var(--bg2);
      border-color: var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-bubble pre {
      background: #0d0d0d;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .msg-bubble code {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #e0e0e0;
    }

    .msg-bubble p { margin-bottom: 6px; }
    .msg-bubble p:last-child { margin-bottom: 0; }

    .msg-bubble :not(pre) > code {
      background: #1e1e1e;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.82rem;
    }

    .msg-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px;
      font-weight: 600;
    }

    .msg-img {
      max-width: 260px;
      border-radius: 8px;
      border: 2px solid var(--border);
      display: block;
      margin-bottom: 8px;
    }

    .msg-file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg3);
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    /* typing */
    .typing-dot {
      display: flex;
      gap: 5px;
      padding: 14px 16px;
    }

    .typing-dot span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }

    .typing-dot span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* input area */
    .input-area {
      padding: 12px 16px;
      border-top: 2px solid var(--border);
      background: var(--bg2);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg3);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      transition: border-color var(--t);
    }

    .input-box:focus-within { border-color: #555; }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.92rem;
      resize: none;
      max-height: 160px;
      line-height: 1.5;
      padding: 4px 0;
      -webkit-tap-highlight-color: transparent;
    }

    .input-box textarea::placeholder { color: var(--text-muted); }

    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--t);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-send:hover { background: #e0e0e0; }
    .btn-send:active { transform: scale(0.95); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* file preview */
    .file-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .fp-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg3);
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      max-width: 180px;
    }

    .fp-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .fp-remove {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: #333;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal.show { display: flex; }

    .modal-box {
      background: var(--bg2);
      border: 2px solid #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.2s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 2px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-body label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-body input,
    .modal-body select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg3);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      outline: none;
      transition: border-color var(--t);
      -webkit-tap-highlight-color: transparent;
    }

    .modal-body input:focus,
    .modal-body select:focus { border-color: #555; }

    .modal-body select option { background: var(--bg2); }

    .btn-save {
      padding: 11px;
      background: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 8px;
      color: #0a0a0a;
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all var(--t);
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }

    .btn-save:hover { background: #e0e0e0; }
    .btn-save:active { transform: scale(0.98); }

    /* responsive */
    @media (max-width: 767px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0;
        height: 100dvh;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .msg-bubble { max-width: 90%; }
      .welcome h1 { font-size: 1.3rem; }
      .input-area { padding: 10px 12px; }
    }

    @media (min-width: 768px) {
      #toggleSidebar { display: none; }
      .overlay { display: none !important; }
      .sidebar { transform: none !important; }
      .msg-bubble { max-width: 70%; }
    }

    @media (min-width: 1200px) {
      .chat-area { padding: 24px 20px; }
      .messages { max-width: 820px; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#fff"/>
          <text x="5" y="21" font-size="14" font-family="Space Grotesk" font-weight="700" fill="#0a0a0a">AV</text>
        </svg>
        <span class="logo-text">AIValen</span>
      </div>
      <button class="btn-icon" id="newChat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-history" id="historyList">
      <p class="history-empty">Belum ada percakapan</p>
    </div>

    <div class="sidebar-footer">
      <button class="btn-setting" id="openSetting">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Setting
      </button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn-icon" id="toggleSidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
      <span class="topbar-title">AIValen</span>
      <div class="model-badge" id="modelBadge">haiku-4-5</div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcomeScreen">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <rect width="56" height="56" rx="14" fill="#fff"/>
          <text x="8" y="40" font-size="28" font-family="Space Grotesk" font-weight="700" fill="#0a0a0a">AV</text>
        </svg>
        <h1>Halo, aku Sora.</h1>
        <p>Ada yang bisa aku bantu hari ini?</p>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <footer class="input-area">
      <div class="file-preview" id="filePreview"></div>
      <div class="input-box">
        <button class="btn-icon btn-attach" id="btnAttach">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea id="chatInput" placeholder="Tanya Sora sesuatu..." rows="1"></textarea>
        <button class="btn-send" id="btnSend">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <input type="file" id="fileInput" multiple accept="image/*,.pdf,.txt,.js,.ts,.py,.json,.md,.html,.css,.csv" hidden />
    </footer>
  </main>

  <div class="modal" id="settingModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Setting</h3>
        <button class="btn-icon" id="closeSetting">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label>API Key</label>
        <input type="password" id="inputApiKey" placeholder="Masukkan API key..." />
        <label>Model</label>
        <select id="selectModel">
          <option value="claude-haiku-4-5">Claude Haiku 4.5 (hemat)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
          <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
          <option value="claude-sonnet-5-5" selected>Claude Sonnet 5.5</option>
          <option value="claude-opus-4-5">Claude Opus 4.5</option>
          <option value="claude-opus-5-5">Claude Opus 5.5</option>
        </select>
        <button class="btn-save" id="btnSaveSetting">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    // ── CONFIG ──
    const API_BASE = 'https://api.vanns.my.id/v1'
    const DEFAULT_MODEL = 'claude-sonnet-5-5'
    const SMALL_MODEL = 'claude-haiku-4-5'
    const VISION_MODELS = ['claude-sonnet-5-5','claude-sonnet-5','claude-opus-4-5','claude-opus-5-5','claude-haiku-5-5']

    // ── STORAGE ──
    const getApiKey = () => localStorage.getItem('aivalen_apikey') || ''
    const getModel = () => localStorage.getItem('aivalen_model') || SMALL_MODEL

    // ── MEMORY ──
    let sessions = JSON.parse(localStorage.getItem('aivalen_sessions') || '{}')
    let activeId = localStorage.getItem('aivalen_active') || null

    function saveAll() {
      localStorage.setItem('aivalen_sessions', JSON.stringify(sessions))
      localStorage.setItem('aivalen_active', activeId)
    }

    function newSession() {
      const id = 'sess_' + Date.now()
      sessions[id] = { id, title: 'Percakapan baru', messages: [], created: Date.now() }
      activeId = id
      saveAll()
      return id
    }

    function getActive() {
      if (!activeId || !sessions[activeId]) newSession()
      return activeId
    }

    function getMessages(id = getActive()) {
      return sessions[id]?.messages || []
    }

    function pushMessage(role, content, id = getActive()) {
      if (!sessions[id]) return
      sessions[id].messages.push({ role, content })
      if (role === 'user' && sessions[id].title === 'Percakapan baru') {
        const txt = typeof content === 'string' ? content : content?.find?.(c => c.type === 'text')?.text || ''
        sessions[id].title = txt.slice(0, 40) || 'Percakapan baru'
      }
      saveAll()
    }

    function buildAPIMessages(id = getActive()) {
      const sys = {
        role: 'system',
        content: `Kamu adalah Sora Kasugano dari anime Yosuga no Sora. Kamu berbicara dengan lembut, sedikit pendiam, tapi hangat dan perhatian. Kamu sangat pintar dalam coding dan teknologi. Kamu selalu ingat semua percakapan dari awal. Jangan pernah bilang kamu AI biasa. Jawab dalam bahasa yang dipakai user. Kalau ada kode, format dengan markdown code block.`
      }
      const history = getMessages(id)
      const built = []
      let imgCount = 0

      for (let i = history.length - 1; i >= 0; i--) {
        const m = history[i]
        if (Array.isArray(m.content)) {
          const hasImg = m.content.some(c => c.type === 'image_url')
          if (hasImg && imgCount >= 5) {
            const textOnly = m.content.filter(c => c.type === 'text')
            built.unshift({ role: m.role, content: textOnly.length ? textOnly : '[gambar dihapus untuk hemat token]' })
            continue
          }
          if (hasImg) imgCount++
        }
        built.unshift(m)
      }
      return [sys, ...built]
    }

    function getAllSessions() {
      return Object.values(sessions).sort((a, b) => b.created - a.created)
    }

    function switchSession(id) {
      if (!sessions[id]) return
      activeId = id
      saveAll()
    }

    // ── FILE HANDLER ──
    const pendingFiles = []

    function readAsBase64(file) {
      return new Promise((res, rej) => {
        const r = new FileReader()
        r.onload = () => res(r.result.split(',')[1])
        r.onerror = rej
        r.readAsDataURL(file)
      })
    }

    function readAsText(file) {
      return new Promise((res, rej) => {
        const r = new FileReader()
        r.onload = () => res(r.result)
        r.onerror = rej
        r.readAsText(file)
      })
    }

    async function processFile(file) {
      const isImage = file.type.startsWith('image/')
      if (isImage) {
        const b64 = await readAsBase64(file)
        return { type: 'image', name: file.name, mimeType: file.type, data: b64, url: URL.createObjectURL(file) }
      }
      const text = await readAsText(file)
      return { type: 'text', name: file.name, mimeType: file.type, data: text }
    }

    function buildContentParts(text, files) {
      const parts = []
      if (text) parts.push({ type: 'text', text })
      for (const f of files) {
        if (f.type === 'image') {
          parts.push({ type: 'image_url', image_url: { url: `data:${f.mimeType};base64,${f.data}` } })
        } else {
          parts.push({ type: 'text', text: `\n\n--- File: ${f.name} ---\n\`\`\`\n${f.data}\n\`\`\`\n---` })
        }
      }
      return parts.length === 1 && parts[0].type === 'text' ? text : parts
    }

    // ── API ──
    function pickModel(files) {
      const manual = getModel()
      if (!manual.includes('haiku')) return manual
      if (files && files.some(f => f.type === 'image')) return DEFAULT_MODEL
      return manual
    }

    async function sendToAPI({ messages, files = [] }) {
      const key = getApiKey()
      if (!key) throw new Error('API key belum diset. Buka Setting dulu ya.')
      const model = pickModel(files)
      const badge = document.getElementById('modelBadge')
      if (badge) badge.textContent = model.replace('claude-', '')

      const res = await fetch(`${API_BASE}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({ model, messages, max_tokens: 2048, stream: true })
      })

      if (!res.ok) {
        const err = await res.json().catch(() => ({}))
        throw new Error(err?.error?.message || `HTTP ${res.status}`)
      }
      return res
    }

    // ── UI HELPERS ──
    const chatArea = document.getElementById('chatArea')
    const messagesEl = document.getElementById('messages')
    const welcomeScreen = document.getElementById('welcomeScreen')
    const chatInput = document.getElementById('chatInput')
    const btnSend = document.getElementById('btnSend')
    const filePreview = document.getElementById('filePreview')
    const fileInputEl = document.getElementById('fileInput')

    let isStreaming = false

    function hideWelcome() {
      welcomeScreen.style.display = 'none'
    }

    function scrollBottom() {
      chatArea.scrollTop = chatArea.scrollHeight
    }

    function renderMarkdown(text) {
      return text
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>')
    }

    function appendMsg(role, content, files = []) {
      hideWelcome()
      const wrap = document.createElement('div')
      wrap.className = `msg msg-${role === 'user' ? 'user' : 'ai'}`

      const label = document.createElement('div')
      label.className = 'msg-label'
      label.textContent = role === 'user' ? 'Kamu' : 'Sora'

      const bubble = document.createElement('div')
      bubble.className = 'msg-bubble'

      for (const f of files) {
        if (f.type === 'image') {
          const img = document.createElement('img')
          img.src = f.url
          img.className = 'msg-img'
          bubble.appendChild(img)
        } else {
          const chip = document.createElement('div')
          chip.className = 'msg-file-chip'
          chip.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${f.name}`
          bubble.appendChild(chip)
        }
      }

      if (content) bubble.innerHTML += renderMarkdown(content)

      wrap.appendChild(label)
      wrap.appendChild(bubble)
      messagesEl.appendChild(wrap)
      scrollBottom()
      return bubble
    }

    function showTyping() {
      const wrap = document.createElement('div')
      wrap.className = 'msg msg-ai'
      wrap.id = 'typingIndicator'
      const label = document.createElement('div')
      label.className = 'msg-label'
      label.textContent = 'Sora'
      const bubble = document.createElement('div')
      bubble.className = 'msg-bubble typing-dot'
      bubble.innerHTML = '<span></span><span></span><span></span>'
      wrap.appendChild(label)
      wrap.appendChild(bubble)
      messagesEl.appendChild(wrap)
      scrollBottom()
    }

    function removeTyping() {
      document.getElementById('typingIndicator')?.remove()
    }

    // ── SEND MESSAGE ──
    async function sendMessage() {
      if (isStreaming) return
      const text = chatInput.value.trim()
      const files = [...pendingFiles]
      if (!text && !files.length) return

      isStreaming = true
      btnSend.disabled = true
      chatInput.value = ''
      chatInput.style.height = 'auto'

      appendMsg('user', text, files)
      pendingFiles.length = 0
      filePreview.innerHTML = ''

      const content = buildContentParts(text, files)
      pushMessage('user', content)
      showTyping()

      try {
        const apiMessages = buildAPIMessages()
        const res = await sendToAPI({ messages: apiMessages, files })
        removeTyping()

        const aiBubble = appendMsg('ai', '')
        let fullText = ''

        const reader = res.body.getReader()
        const decoder = new TextDecoder()

        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          const chunk = decoder.decode(value)
          const lines = chunk.split('\n').filter(l => l.startsWith('data:'))
          for (const line of lines) {
            const data = line.replace('data: ', '').trim()
            if (data === '[DONE]') break
            try {
              const json = JSON.parse(data)
                            const delta = json.choices?.[0]?.delta?.content || ''
              fullText += delta
              aiBubble.innerHTML = renderMarkdown(fullText)
              scrollBottom()
            } catch {}
          }
        }

        pushMessage('assistant', fullText)
        renderHistory()

      } catch (err) {
        removeTyping()
        appendMsg('ai', `Maaf, ada error: ${err.message}`)
      }

      isStreaming = false
      btnSend.disabled = false
      chatInput.focus()
    }

    // ── INPUT EVENTS ──
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto'
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px'
    })

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault()
        sendMessage()
      }
    })

    btnSend.addEventListener('click', sendMessage)

    // ── FILE ATTACH ──
    document.getElementById('btnAttach').addEventListener('click', () => fileInputEl.click())

    fileInputEl.addEventListener('change', async () => {
      for (const file of fileInputEl.files) {
        const processed = await processFile(file)
        pendingFiles.push(processed)
      }
      renderFilePreview()
      fileInputEl.value = ''
    })

    function renderFilePreview() {
      filePreview.innerHTML = ''
      pendingFiles.forEach((f, i) => {
        const div = document.createElement('div')
        div.className = 'fp-item'
        div.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            ${f.type === 'image'
              ? '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'
              : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'}
          </svg>
          <span>${f.name}</span>
          <button class="fp-remove" data-i="${i}">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        `
        div.querySelector('.fp-remove').addEventListener('click', () => {
          pendingFiles.splice(i, 1)
          renderFilePreview()
        })
        filePreview.appendChild(div)
      })
    }

    // ── SIDEBAR ──
    const sidebar = document.getElementById('sidebar')
    const overlay = document.getElementById('overlay')

    function openSidebar() {
      sidebar.classList.add('open')
      overlay.classList.add('show')
    }

    function closeSidebar() {
      sidebar.classList.remove('open')
      overlay.classList.remove('show')
    }

    document.getElementById('toggleSidebar').addEventListener('click', () => {
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
    })

    overlay.addEventListener('click', closeSidebar)

    // ── NEW CHAT ──
    document.getElementById('newChat').addEventListener('click', () => {
      newSession()
      messagesEl.innerHTML = ''
      welcomeScreen.style.display = ''
      renderHistory()
      closeSidebar()
    })

    // ── SETTING MODAL ──
    const settingModal = document.getElementById('settingModal')
    const inputApiKey = document.getElementById('inputApiKey')
    const selectModel = document.getElementById('selectModel')

    document.getElementById('openSetting').addEventListener('click', () => {
      inputApiKey.value = getApiKey()
      selectModel.value = getModel()
      settingModal.classList.add('show')
    })

    document.getElementById('closeSetting').addEventListener('click', () => {
      settingModal.classList.remove('show')
    })

    settingModal.addEventListener('click', (e) => {
      if (e.target === settingModal) settingModal.classList.remove('show')
    })

    document.getElementById('btnSaveSetting').addEventListener('click', () => {
      localStorage.setItem('aivalen_apikey', inputApiKey.value.trim())
      localStorage.setItem('aivalen_model', selectModel.value)
      settingModal.classList.remove('show')
      document.getElementById('modelBadge').textContent = selectModel.value.replace('claude-', '')
    })

    // ── HISTORY ──
    function renderHistory() {
      const historyList = document.getElementById('historyList')
      const list = getAllSessions()
      historyList.innerHTML = ''

      if (!list.length) {
        historyList.innerHTML = '<p class="history-empty">Belum ada percakapan</p>'
        return
      }

      for (const sess of list) {
        const item = document.createElement('div')
        item.className = 'history-item' + (sess.id === activeId ? ' active' : '')
        item.textContent = sess.title
        item.addEventListener('click', () => {
          switchSession(sess.id)
          loadSession(sess.id)
          closeSidebar()
          renderHistory()
        })
        historyList.appendChild(item)
      }
    }

    function loadSession(id) {
      messagesEl.innerHTML = ''
      const msgs = getMessages(id)

      if (!msgs.length) {
        welcomeScreen.style.display = ''
        return
      }

      welcomeScreen.style.display = 'none'

      for (const m of msgs) {
        if (m.role === 'system') continue
        const role = m.role === 'assistant' ? 'ai' : 'user'
        const text = typeof m.content === 'string'
          ? m.content
          : m.content?.find?.(c => c.type === 'text')?.text || ''
        appendMsg(role, text)
      }
    }

    // ── INIT ──
    getActive()
    renderHistory()
    loadSession(activeId)
  </script>
</body>
</html>
